<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Fitness Trainer - Workout</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>🏋️ AI Fitness Trainer</h1>
            <nav>
                <a href="/" class="active">Workout</a>
                <a href="/dashboard">Dashboard</a>
            </nav>
        </header>

        <div class="main-content">
            <div class="video-section">
                <div class="video-container">
                    <img src="{{ url_for('video_feed') }}" alt="Live Video Feed" class="video-feed">
                </div>
                
                <div class="stats-overlay">
                    <div class="stat-item">
                        <span class="stat-label">Reps</span>
                        <span class="stat-value" id="reps-count">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Duration</span>
                        <span class="stat-value" id="duration">00:00</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Stage</span>
                        <span class="stat-value" id="stage">Ready</span>
                    </div>
                </div>
            </div>

            <div class="control-panel">
                <div class="exercise-selector">
                    <h2>Select Exercise</h2>
                    <div class="exercise-buttons" id="exercise-buttons">
                        <button class="exercise-btn active" data-exercise="squat">
                            <div class="exercise-icon">🏋️</div>
                            <div class="exercise-name">Squats</div>
                        </button>
                        <button class="exercise-btn" data-exercise="pushup">
                            <div class="exercise-icon">💪</div>
                            <div class="exercise-name">Push-ups</div>
                        </button>
                        <button class="exercise-btn" data-exercise="curl">
                            <div class="exercise-icon">💪</div>
                            <div class="exercise-name">Bicep Curls</div>
                        </button>
                        <button class="exercise-btn" data-exercise="shoulder_press">
                            <div class="exercise-icon">🏋️</div>
                            <div class="exercise-name">Shoulder Press</div>
                        </button>
                    </div>
                </div>

                <div class="session-controls">
                    <button id="start-btn" class="control-btn start-btn">
                        <span>▶</span> Start Workout
                    </button>
                    <button id="stop-btn" class="control-btn stop-btn" disabled>
                        <span>⏹</span> Stop & Save
                    </button>
                    <button id="reset-btn" class="control-btn reset-btn" disabled>
                        <span>↻</span> Reset Counter
                    </button>
                </div>

                <div class="feedback-panel">
                    <h3>💡 Tips & Feedback</h3>
                    <div id="feedback-messages" class="feedback-messages">
                        <p class="feedback-msg info">Select an exercise and press START to begin</p>
                    </div>
                </div>

                <div class="quick-stats">
                    <h3>📊 Today's Progress</h3>
                    <div class="quick-stats-grid">
                        <div class="quick-stat">
                            <div class="quick-stat-value" id="total-reps">0</div>
                            <div class="quick-stat-label">Total Reps</div>
                        </div>
                        <div class="quick-stat">
                            <div class="quick-stat-value" id="total-workouts">0</div>
                            <div class="quick-stat-label">Workouts</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <footer>
            <p>Stay safe! Listen to your body and maintain proper form.</p>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
